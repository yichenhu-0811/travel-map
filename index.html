<style>
:root{--bg:#f6f7f8;--card:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#d9dce0;--acc:#2a7f74;--err:#b3261e}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = u => btoa(String.fromCharCode(...u));
const K = "tm_key_" + P.salt.slice(0, 12);
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter}, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(pt);
  // replace the page only after it has fully loaded; earlier, document.write would append instead
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, {once: true}));
  document.open(); document.write(html); document.close();
}
(async () => {
  if (location.hash === "#forget") { try { localStorage.removeItem(K); } catch (e) {} history.replaceState(null, "", location.pathname); }
  let saved = null; try { saved = localStorage.getItem(K); } catch (e) {}
  if (saved) { try { await open(b64(saved)); return; } catch (e) { try { localStorage.removeItem(K); } catch (_) {} } }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("e");
  btn.disabled = true; btn.textContent = "解锁中…"; err.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(k => crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, k, b64(P.ct)));
    if (document.getElementById("rem").checked) { try { localStorage.setItem(K, enc(raw)); } catch (e) {} }
    await open(raw);
  } catch (e) {
    err.textContent = "密码不正确，请再试一次。"; btn.disabled = false; btn.textContent = "打开地图";
  }
});
